# Navidrome on its own, for PandaFM 5.3 and later.
#
# Upgrading from PandaFM 5.2 or earlier (which bundled Navidrome)? This reuses the
# existing volume, so your Navidrome users, playlists, favourites and play counts stay.
# New installs can use it too (a fresh volume is created).
#
#   MUSIC_DIR=/path/to/your/music docker compose -p navidrome up -d
#
# Then connect PandaFM to http://<this-host>:4533 in PandaFM's setup or Settings.

name: navidrome

services:
  navidrome:
    image: deluan/navidrome:${NAVIDROME_VERSION:-0.64.2}
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: ${NAVIDROME_SCAN_SCHEDULE:-@every 1h}
      ND_LOGLEVEL: info
    volumes:
      - navidrome-data:/data
      - ${MUSIC_DIR:?Set MUSIC_DIR to your music folder}:/music:ro

volumes:
  navidrome-data:
    # PandaFM 5.2's volume: keeps your existing Navidrome database. For a brand-new
    # Navidrome, remove the two lines below.
    external: true
    name: pandafm_navidrome-data
