# PandaFM - single Portainer stack
#
# Deploy this repository as ONE Git-based stack in Portainer. The stack
# contains Navidrome, PandaFM API, PandaFM Web, PostgreSQL and Caddy.
#
# Configure the variables in Portainer's Stack > Environment variables.
# Nothing in this file requires a local .env file when deployed by Portainer.

name: pandafm

services:
  # ── Navidrome: scans and streams the music library ──────────────────
  navidrome:
    image: deluan/navidrome:${NAVIDROME_VERSION:-0.64.2}
    container_name: pandafm-navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: ${NAVIDROME_SCAN_SCHEDULE:-@every 1h}
      ND_LOGLEVEL: info
    volumes:
      # Docker-managed persistent Navidrome database/cache.
      - navidrome-data:/data

      # Your UGREEN library is mounted read-only. Override MUSIC_DIR in
      # Portainer if this host path ever changes.
      - ${MUSIC_DIR:-/mnt/ugreen/media/Music}:/music:ro

  # ── PandaFM database ────────────────────────────────────────────────
  pandafm-db:
    image: postgres:17-alpine
    container_name: pandafm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandafm}
      POSTGRES_USER: ${POSTGRES_USER:-pandafm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - pandafm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── PandaFM backend ─────────────────────────────────────────────────
  pandafm-api:
    build:
      context: ./api
    container_name: pandafm-api
    restart: unless-stopped
    depends_on:
      pandafm-db:
        condition: service_healthy
      navidrome:
        condition: service_started
    environment:
      PANDAFM_DB_HOST: pandafm-db
      PANDAFM_DB_NAME: ${POSTGRES_DB:-pandafm}
      PANDAFM_DB_USER: ${POSTGRES_USER:-pandafm}
      PANDAFM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}

      # Uses the service name over the private Docker network.
      PANDAFM_NAVIDROME_URL: http://navidrome:4533
      PANDAFM_NAVIDROME_USER: ${NAVIDROME_USER:?Set NAVIDROME_USER in Portainer}
      PANDAFM_NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:?Set NAVIDROME_PASSWORD in Portainer}

      PANDAFM_LOG_LEVEL: ${PANDAFM_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── PandaFM frontend ────────────────────────────────────────────────
  pandafm-web:
    build:
      context: ./web
    container_name: pandafm-web
    restart: unless-stopped

  # ── Single entry point for PandaFM ──────────────────────────────────
  caddy:
    image: caddy:2.11-alpine
    container_name: pandafm-caddy
    restart: unless-stopped
    depends_on:
      - pandafm-api
      - pandafm-web
    ports:
      - "${PANDAFM_HTTP_PORT:-8085}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  navidrome-data:
  pandafm-db:
  caddy-data:
  caddy-config:
