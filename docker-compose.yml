# PandaFM: the PandaFM stack only (5.3).
#
# PandaFM connects to a music server you already run: Navidrome or another
# OpenSubsonic server, anywhere PandaFM can reach (this host, another stack,
# another machine). It is NOT part of this stack. Don't have one yet? See
# examples/navidrome-compose.yml.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD (everything else is optional)
#   docker compose up -d --build
#   open http://<this host>:8086 and follow the setup
#
# Persistent data lives in three volumes; back them up together:
#   pandafm-db      listening history, playlists' extras, settings (PostgreSQL)
#   pandafm-config  PandaFM's installation key (decrypts the saved music server password)
#   pandafm-cache   re-creatable conversions and analysis scratch space
name: pandafm

services:
  pandafm-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandafm}
      POSTGRES_USER: ${POSTGRES_USER:-pandafm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - pandafm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  pandafm-api:
    # Built from this repository. To use a published image instead, replace `build:` with it.
    image: ${PANDAFM_API_IMAGE:-pandafm-api:local}
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      pandafm-db:
        condition: service_healthy  # PandaFM no longer waits for (or starts) a music server
    environment:
      PANDAFM_DB_HOST: pandafm-db
      PANDAFM_DB_NAME: ${POSTGRES_DB:-pandafm}
      PANDAFM_DB_USER: ${POSTGRES_USER:-pandafm}
      PANDAFM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}
      PANDAFM_CONFIG_DIR: /config
      PANDAFM_CONFIG_KEY: ${PANDAFM_CONFIG_KEY:-}
      PANDAFM_CACHE_DIR: /cache
      PANDAFM_CACHE_MAX_GB: ${PANDAFM_CACHE_MAX_GB:-20}
      PANDAFM_LOG_LEVEL: ${PANDAFM_LOG_LEVEL:-info}
      PANDAFM_SETUP_TOKEN: ${PANDAFM_SETUP_TOKEN:-}
      PANDAFM_TRUSTED_PROXIES: ${PANDAFM_TRUSTED_PROXIES:-}
      PANDAFM_API_DOCS: ${PANDAFM_API_DOCS:-false}
      PANDAFM_MIX_ANALYSIS_WORKERS: ${PANDAFM_MIX_ANALYSIS_WORKERS:-1}
      PANDAFM_MIX_LOOKAHEAD: ${PANDAFM_MIX_LOOKAHEAD:-3}
      # Upgrading from 5.2 or earlier only: imported once (encrypted) if no music server is saved
      # yet, then ignored. New installs leave these empty and connect the music server in the app.
      PANDAFM_NAVIDROME_URL: ${PANDAFM_NAVIDROME_URL:-}
      PANDAFM_NAVIDROME_USER: ${PANDAFM_NAVIDROME_USER:-${NAVIDROME_USER:-}}
      PANDAFM_NAVIDROME_PASSWORD: ${PANDAFM_NAVIDROME_PASSWORD:-${NAVIDROME_PASSWORD:-}}
    volumes:
      - ${PANDAFM_RELEASES_DIR:-/srv/pandafm/releases}:/releases:ro  # 5.4.1: published Android releases (read-only)
      - pandafm-config:/config
      - pandafm-cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  pandafm-web:
    image: ${PANDAFM_WEB_IMAGE:-pandafm-web:local}
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - pandafm-api
    ports:
      - "${PANDAFM_WEB_PORT:-8086}:80"
    volumes:
      - ${PANDAFM_RELEASES_DIR:-/srv/pandafm/releases}:/releases:ro  # 5.4.1: published Android releases (read-only)

volumes:
  pandafm-db:
  pandafm-config:
  pandafm-cache:
