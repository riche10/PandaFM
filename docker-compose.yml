# PandaFM - single Portainer stack
#
# Deploy this repository as ONE Git-based stack in Portainer.
# Your existing reverse proxy sits OUTSIDE this stack and only needs to
# forward PandaFM traffic to PANDAFM_WEB_PORT (default 8086).
#
# Stack contents:
#   - Navidrome
#   - PandaFM API
#   - PandaFM Web
#   - PostgreSQL
#
# Configure variables in Portainer > Stack > Environment variables.

name: pandafm

services:
  # One-shot helper: Docker named volumes start root-owned, while Navidrome
  # runs unprivileged as PUID:PGID. Fix /data ownership before Navidrome boots.
  pandafm-db:
    image: postgres:17-alpine
    container_name: pandafm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandafm}
      POSTGRES_USER: ${POSTGRES_USER:-pandafm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - pandafm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  pandafm-api:
    build:
      context: ./api
    container_name: pandafm-api
    restart: unless-stopped
    depends_on:
      pandafm-db:
        condition: service_healthy
    environment:
      PANDAFM_DB_HOST: pandafm-db
      PANDAFM_DB_NAME: ${POSTGRES_DB:-pandafm}
      PANDAFM_DB_USER: ${POSTGRES_USER:-pandafm}
      PANDAFM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      # 5.3: PandaFM no longer bundles Navidrome. Connect your own Navidrome / OpenSubsonic
      # server during first-run setup (or Settings › Music server). These legacy settings
      # still work if set (they then manage the server); leave them empty for new installs.
      PANDAFM_NAVIDROME_URL: ${PANDAFM_NAVIDROME_URL:-}
      PANDAFM_NAVIDROME_USER: ${PANDAFM_NAVIDROME_USER:-}
      PANDAFM_NAVIDROME_PASSWORD: ${PANDAFM_NAVIDROME_PASSWORD:-}
      # Encrypts the stored music-server password. Optional: without it PandaFM generates a
      # key once in the pandafm-data volume (keep that volume).
      PANDAFM_SECRET_KEY: ${PANDAFM_SECRET_KEY:-}
      PANDAFM_DATA_DIR: /data
      PANDAFM_LOG_LEVEL: ${PANDAFM_LOG_LEVEL:-info}
      # 5.0: lets you (once) create PandaFM's owner account. Any long random string,
      # e.g. `openssl rand -hex 24`. It stops working when the owner exists.
      PANDAFM_SETUP_TOKEN: ${PANDAFM_SETUP_TOKEN:-}
      PANDAFM_API_DOCS: ${PANDAFM_API_DOCS:-false}
      # Converted copies for downloads live in their own volume, never in the library.
      PANDAFM_CACHE_DIR: /cache
      PANDAFM_CACHE_MAX_GB: ${PANDAFM_CACHE_MAX_GB:-20}
    volumes:
      - pandafm-cache:/cache
      - pandafm-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  pandafm-web:
    build:
      context: ./web
    container_name: pandafm-web
    restart: unless-stopped
    depends_on:
      - pandafm-api
    ports:
      - "${PANDAFM_WEB_PORT:-8086}:80"

volumes:
  pandafm-data:
  pandafm-db:
  pandafm-cache:
