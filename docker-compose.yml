# PandaFM - single Portainer stack
#
# Deploy this repository as ONE Git-based stack in Portainer.
# Your existing reverse proxy sits OUTSIDE this stack and only needs to
# forward PandaFM traffic to PANDAFM_WEB_PORT (default 8086).
#
# Stack contents:
#   - Navidrome
#   - PandaFM API
#   - PandaFM Web
#   - PostgreSQL
#
# Configure variables in Portainer > Stack > Environment variables.

name: pandafm

services:
  # One-shot helper: Docker named volumes start root-owned, while Navidrome
  # runs unprivileged as PUID:PGID. Fix /data ownership before Navidrome boots.
  navidrome-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - "chown -R ${PUID:-1000}:${PGID:-1000} /data"
    volumes:
      - navidrome-data:/data

  navidrome:
    image: deluan/navidrome:${NAVIDROME_VERSION:-0.64.2}
    container_name: pandafm-navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      navidrome-init:
        condition: service_completed_successfully
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: ${NAVIDROME_SCAN_SCHEDULE:-@every 1h}
      ND_LOGLEVEL: info
    volumes:
      - navidrome-data:/data
      - ${MUSIC_DIR:-/mnt/ugreen/media/Music}:/music:ro

  pandafm-db:
    image: postgres:17-alpine
    container_name: pandafm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandafm}
      POSTGRES_USER: ${POSTGRES_USER:-pandafm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - pandafm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  pandafm-api:
    build:
      context: ./api
    container_name: pandafm-api
    restart: unless-stopped
    depends_on:
      pandafm-db:
        condition: service_healthy
      navidrome:
        condition: service_started
    environment:
      PANDAFM_DB_HOST: pandafm-db
      PANDAFM_DB_NAME: ${POSTGRES_DB:-pandafm}
      PANDAFM_DB_USER: ${POSTGRES_USER:-pandafm}
      PANDAFM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      PANDAFM_NAVIDROME_URL: http://navidrome:4533
      PANDAFM_NAVIDROME_USER: ${NAVIDROME_USER:?Set NAVIDROME_USER in Portainer}
      PANDAFM_NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:?Set NAVIDROME_PASSWORD in Portainer}
      PANDAFM_LOG_LEVEL: ${PANDAFM_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  pandafm-web:
    build:
      context: ./web
    container_name: pandafm-web
    restart: unless-stopped
    depends_on:
      - pandafm-api
    ports:
      - "${PANDAFM_WEB_PORT:-8086}:80"

volumes:
  navidrome-data:
  pandafm-db:
