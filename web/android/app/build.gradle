apply plugin: 'com.android.application'

// App version: bump both values in version.properties for every APK you install (see docs/android.md).
def pandafmVersion = new Properties()
file('version.properties').withInputStream { pandafmVersion.load(it) }

// Stable development signing: build-apk.sh passes -PpandafmSigning=<properties file> from a
// persistent, untracked location, so each new APK installs over the previous one.
def pandafmSigning = new Properties()
if (project.hasProperty('pandafmSigning') && file(project.property('pandafmSigning')).exists()) {
    file(project.property('pandafmSigning')).withInputStream { pandafmSigning.load(it) }
}

android {
    namespace = "app.pandafm.client"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.pandafm.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pandafmVersion['versionCode'] as Integer
        versionName pandafmVersion['versionName']
        // HTTPS-only by default. Build with -PpandafmAllowHttp=true to also reach a
        // plain-http server on your LAN (see docs/android.md).
        manifestPlaceholders = [networkSecurityConfig: project.hasProperty('pandafmAllowHttp') && project.property('pandafmAllowHttp') == 'true'
            ? "@xml/network_security_config_lan" : "@xml/network_security_config"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (!pandafmSigning.isEmpty()) {
            pandafmDev {
                storeFile file(pandafmSigning['storeFile'])
                storePassword pandafmSigning['storePassword']
                keyAlias pandafmSigning['keyAlias']
                keyPassword pandafmSigning['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (!pandafmSigning.isEmpty()) signingConfig signingConfigs.pandafmDev
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
