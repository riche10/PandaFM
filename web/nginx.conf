server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Looking the API up per request, instead of once
    # at startup, keeps /api working after a redeploy recreates pandafm-api
    # with a new IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pandafm_api http://pandafm-api:8000;

    # Keep PandaFM same-origin. The browser calls /api/* and this internal
    # web server forwards those requests to the FastAPI service over the
    # private Docker network.
    location /api/ {
        # With a variable and no URI part, Nginx forwards the original
        # request path and query string unchanged.
        proxy_pass $pandafm_api;
        proxy_http_version 1.1;

        # Stream responses (audio) to the browser as they arrive. Range and
        # If-Range request headers are forwarded by default, so seeking works.
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React/PWA client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
