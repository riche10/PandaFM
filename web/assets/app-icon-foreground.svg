<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- PandaFM launcher icon, foreground layer: a panda face with headphones.
       Everything stays inside Android's adaptive-icon safe zone (a circle of
       radius 313 around the centre of this 1024 canvas = 66dp of 108dp). -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- headband (behind the ears and head) -->
    <path d="M276 530 C270 236 754 236 748 530" fill="none" stroke="#3B3430" stroke-width="40"/>
    <path d="M300 470 C306 290 718 290 724 470" fill="none" stroke="#5C524B" stroke-width="8" opacity="0.7"/>
    <!-- ears -->
    <circle cx="360" cy="372" r="66" fill="#151211"/>
    <circle cx="664" cy="372" r="66" fill="#151211"/>
    <!-- head -->
    <circle cx="512" cy="548" r="212" fill="#FBF8F3"/>
    <!-- ear cups -->
    <rect x="232" y="506" width="88" height="148" rx="40" fill="#2E2926"/>
    <rect x="704" y="506" width="88" height="148" rx="40" fill="#2E2926"/>
    <rect x="296" y="530" width="18" height="100" rx="9" fill="#4D443F"/>
    <rect x="710" y="530" width="18" height="100" rx="9" fill="#4D443F"/>
    <!-- eye patches, eyes -->
    <ellipse cx="434" cy="548" rx="56" ry="74" transform="rotate(-28 434 548)" fill="#151211"/>
    <ellipse cx="590" cy="548" rx="56" ry="74" transform="rotate(28 590 548)" fill="#151211"/>
    <circle cx="447" cy="537" r="17" fill="#FBF8F3"/>
    <circle cx="577" cy="537" r="17" fill="#FBF8F3"/>
    <!-- nose, mouth -->
    <ellipse cx="512" cy="628" rx="30" ry="20" fill="#151211"/>
    <path d="M486 662 Q512 686 538 662" fill="none" stroke="#151211" stroke-width="10"/>
  </g>
</svg>
